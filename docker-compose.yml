# @format
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_PS_USER}
      POSTGRES_PASSWORD: ${DB_PS_PASSWORD}
      POSTGRES_DB: ${DB_PS_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PS_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RabbitMQ config
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-request-api:
    build:
      context: .
      dockerfile: ./payment-request-api/Dockerfile
    env_file:
      - path: ./payment-request-api/.env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-consumer:
    build:
      context: .
      dockerfile: ./payment-consumer/Dockerfile
    env_file:
      - path: ./payment-consumer/.env
        required: false
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
